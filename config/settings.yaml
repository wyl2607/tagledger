# TagLedger — portfolio / generic demo settings
# No site-specific factory paths. Demo sample data is generated on first run.
app:
  database_url: sqlite:///data/app.db
  upload_dir: data/uploads
  screenshot_dir: data/screenshots
  # mock = zero-dependency demo; switch to tesseract for real OCR.
  ocr_provider: mock
  enable_barcode: true
  # SaaS submit stays off for the public demo.
  enable_saas_submit: false
  dry_run: true
  submission_retries: 3
  outbound_workbook_path: data/outbound/outbound_today.xlsx
  outbound_shipping_sheet: shipping
  outbound_cutting_sheet: cutting
  # 0 = disabled (static portfolio sample). Set e.g. 3 for live shop floors.
  outbound_workbook_max_age_days: 0
  material_mapping_max_age_days: 0
metrics:
  manual_seconds: 90
